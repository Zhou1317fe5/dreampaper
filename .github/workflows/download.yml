name: OCR download diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 检查模型源响应
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {spawnSync} from 'node:child_process';
          import {readFileSync, rmSync} from 'node:fs';
          const url = 'https://paddle-model-ecology.bj.bcebos.com/paddlex/official_inference_model/paddle3.0.0/PP-OCRv6_medium_det_onnx_infer.tar';
          const variants = [
            ['original', url, []],
            ['range', url, ['--range','0-1023']],
            ['query', url + '?download=1', ['--range','0-1023']],
            ['browser', url, ['--range','0-1023','-A','Mozilla/5.0']],
            ['http1', url, ['--range','0-1023','--http1.1']]
          ];
          for (const [name, target, extra] of variants) {
            const result = spawnSync('curl', ['-sS','-L','--max-time','25','-D','headers.txt','-o','body.bin','-A','DreamPaper/0.2.0 (+https://github.com/dream-rec/dreampaper)', ...extra, target], {encoding:'utf8'});
            const body = (() => { try { return readFileSync('body.bin'); } catch { return Buffer.alloc(0); } })();
            console.log(JSON.stringify({name, exit:result.status, stderr:result.stderr, headers:readFileSync('headers.txt','utf8'), bytes:body.length, body:body.length < 8000 ? body.toString('utf8') : '<binary>'}));
            rmSync('headers.txt',{force:true}); rmSync('body.bin',{force:true});
          }
          JS
